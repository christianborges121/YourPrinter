name: yourprinter
description: YourPrinter mobile monitoring and control client for Android and iOS.
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0
  web_socket_channel: 3.0.1
  flutter_webrtc: 1.6.2+hotfix.4
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  wakelock_plus: ^1.1.4
  cached_network_image: ^3.3.1
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
