<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Unified Stem Logo for YourPrinter (Same Color Across All Letters) -->
  <g stroke="#00ae42" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Continuous vertical spine: combines P backbone and shared Y bottom stem -->
    <path d="M 54 24 L 54 96" />
    <!-- Left diagonal branch of Y -->
    <path d="M 28 24 L 54 54" />
    <!-- Upper loop of P connecting to top and returning to center junction -->
    <path d="M 54 24 L 78 24 C 98 24 98 54 78 54 L 54 54" />
  </g>
</svg>
